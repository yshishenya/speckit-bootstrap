name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Static and unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            exit 0
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Validate shell syntax
        run: bash -n bin/speckit-bootstrap install.sh tests/ci-local.sh tests/unit.sh tests/smoke-live.sh

      - name: Run ShellCheck
        run: shellcheck bin/speckit-bootstrap install.sh tests/ci-local.sh tests/unit.sh tests/smoke-live.sh

      - name: Run isolated unit tests
        run: bash tests/unit.sh

  smoke-pinned:
    name: Pinned upstream smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: ''
          cache-suffix: speckit-v0.15.2
          prune-cache: false
          ignore-nothing-to-cache: true

      - name: Run live bootstrap smoke test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPEC_KIT_VERSION: v0.15.2
          SPECKIT_GITHUB_ISSUE_CANON_VERSION: v0.3.1
        run: bash tests/smoke-live.sh

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflow syntax
        run: actionlint

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: ''
          cache-suffix: zizmor-1.29.0
          prune-cache: false
          ignore-nothing-to-cache: true

      - name: Audit workflow security
        run: uvx --from zizmor==1.29.0 zizmor --pedantic .

  required:
    name: CI / required
    if: ${{ always() }}
    needs:
      - static-and-unit
      - smoke-pinned
      - workflow-security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every stable CI lane
        env:
          STATIC_RESULT: ${{ needs.static-and-unit.result }}
          SMOKE_RESULT: ${{ needs.smoke-pinned.result }}
          WORKFLOW_SECURITY_RESULT: ${{ needs.workflow-security.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$SMOKE_RESULT" = success
          test "$WORKFLOW_SECURITY_RESULT" = success
