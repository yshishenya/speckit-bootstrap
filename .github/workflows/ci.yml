name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Static and unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            exit 0
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: Validate shell syntax
        run: bash -n bin/speckit-bootstrap install.sh tests/unit.sh tests/smoke-live.sh

      - name: Run ShellCheck
        run: shellcheck bin/speckit-bootstrap install.sh tests/unit.sh tests/smoke-live.sh

      - name: Run isolated unit tests
        run: bash tests/unit.sh

  smoke-pinned:
    name: Pinned upstream smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.6'
          enable-cache: false

      - name: Run live bootstrap smoke test
        env:
          SPEC_KIT_VERSION: v0.12.11
          SPECKIT_GITHUB_ISSUE_CANON_VERSION: v0.2.6
        run: bash tests/smoke-live.sh

  smoke-upstream-latest:
    name: Latest upstream compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.10.6'
          enable-cache: false

      - name: Run against current upstream tags
        env:
          SPEC_KIT_VERSION: latest
          SPECKIT_GITHUB_ISSUE_CANON_VERSION: latest
        run: bash tests/smoke-live.sh
