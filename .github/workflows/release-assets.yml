name: Publish verified release assets

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build installer assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate release version and tests
        shell: bash
        run: |
          set -euo pipefail
          version="$(bin/speckit-bootstrap --version | awk '{print $2}')"
          test "v$version" = "$RELEASE_TAG"
          bash -n bin/speckit-bootstrap install.sh tests/unit.sh tests/smoke-live.sh
          bash tests/unit.sh

      - name: Build checksummed assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0755 bin/speckit-bootstrap dist/speckit-bootstrap
          cd dist
          sha256sum speckit-bootstrap > speckit-bootstrap.sha256

      - name: Store verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-assets
          path: |
            dist/speckit-bootstrap
            dist/speckit-bootstrap.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Upload verified installer assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # Download artifacts produced by the unprivileged build job.
      contents: write # Upload assets to the already-published release.
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          dist/speckit-bootstrap
          dist/speckit-bootstrap.sha256
          --clobber
