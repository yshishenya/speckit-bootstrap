version: 2
updates:
  # Latest updates are requested explicitly; immutable pins and CI gate merging.
  - package-ecosystem: github-actions # zizmor: ignore[dependabot-cooldown]
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: npm # zizmor: ignore[dependabot-cooldown]
    directory: /tests/canary
    schedule:
      interval: daily
    groups:
      codex-canary:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
